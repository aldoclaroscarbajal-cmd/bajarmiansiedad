<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Botiquín SOS: Autorregulación Inmediata</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- React & Babel CDNs -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.6/babel.min.js"></script>

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f8fafc;
    }
    
    @keyframes fadeIn { 
      from { opacity: 0; transform: translateY(8px); } 
      to { opacity: 1; transform: translateY(0); } 
    }
    .animate-fade-in { animation: fadeIn 0.35s ease-out forwards; }
    
    @keyframes pulseSlow {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.08); opacity: 1; }
    }
    .animate-pulse-slow { animation: pulseSlow 4s ease-in-out infinite; }

    @keyframes breatheBox {
      0% { transform: scale(1); }
      33% { transform: scale(1.35); }
      66% { transform: scale(1.35); }
      100% { transform: scale(1); }
    }
    .animate-breathe { animation: breatheBox 19s ease-in-out infinite; }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 10px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  </style>
</head>
<body class="text-slate-800 antialiased p-3 sm:p-6 md:p-8 flex justify-center">
  <div id="root" class="w-full max-w-4xl mx-auto h-auto"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Helper SVG Component with safe grouping to prevent Babel parser errors
    const Icon = ({ name, className = "w-5 h-5", size = 20 }) => {
      const icons = {
        zap: <path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z" />,
        shield: <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />,
        anchor: <g><circle cx="12" cy="5" r="3" /><line x1="12" y1="8" x2="12" y2="22" /><path d="M5 12H2a10 10 0 0 0 20 0h-3" /></g>,
        activity: <path d="M22 12h-4l-3 9L9 3l-3 9H2" />,
        clock: <g><circle cx="12" cy="12" r="10" /><polyline points="12 6 12 12 16 14" /></g>,
        eye: <g><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z" /><circle cx="12" cy="12" r="3" /></g>,
        hand: <g><path d="M18 11V6a2 2 0 0 0-4 0v5" /><path d="M14 10V4a2 2 0 0 0-4 0v6" /><path d="M10 10.5V6a2 2 0 0 0-4 0v8" /><path d="M18 8a2 2 0 0 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15" /></g>,
        ear: <g><path d="M6 8.5a6.5 6.5 0 1 1 13 0c0 6-6 6-6 10" /><path d="M12 18.5a2.5 2.5 0 0 0 0-5 2.5 2.5 0 0 1 0-5" /><circle cx="12" cy="18.5" r="1" /></g>,
        wind: <path d="M17.7 7.7a2.5 2.5 0 1 1 1.8 4.3H2M9.6 4.6A2 2 0 1 1 11 8H2M12.6 19.4A2 2 0 1 0 14 16H2" />,
        smile: <g><circle cx="12" cy="12" r="10" /><path d="M8 14s1.5 2 4 2 4-2 4-2" /><line x1="9" y1="9" x2="9.01" y2="9" /><line x1="15" y1="9" x2="15.01" y2="9" /></g>,
        check: <path d="M20 6 9 17l-5-5" />,
        arrowRight: <path d="M5 12h14M12 5l7 7-7 7" />,
        refreshCw: <g><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" /><path d="M3 3v5h5" /></g>,
        trash2: <g><path d="M3 6h18" /><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6" /><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2" /></g>,
        sparkles: <g><path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3Z" /></g>,
        heart: <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z" />
      };
      return (
        <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          {icons[name] || <circle cx="12" cy="12" r="10" />}
        </svg>
      );
    };

    const STORAGE_KEY = 'ansiedad_sos_historial_v1';

    const MUSCLE_ZONES = [
      { id: 'rostro', label: 'Rostro y Mandíbula', instructions: 'Aprieta los dientes suavemente, frunce el ceño y cierra los ojos con fuerza.', icon: 'smile' },
      { id: 'hombros', label: 'Hombros y Cuello', instructions: 'Lleva los hombros hacia arriba como si quisieras tocar tus orejas. Siente la carga.', icon: 'activity' },
      { id: 'manos', label: 'Manos y Brazos', instructions: 'Haz puños cerrados con ambas manos y aprieta los antebrazos como si sostuvieras algo pesado.', icon: 'hand' },
      { id: 'pecho', label: 'Pecho y Abdomen', instructions: 'Contrae el abdomen endureciendo la zona del estómago y toma aire profundamente.', icon: 'wind' }
    ];

    const GROUNDING_STEPS = [
      { count: 5, label: 'Cosas que ves', icon: 'eye', color: 'text-indigo-500', bg: 'bg-indigo-50', placeholder: 'Ej: Una ventana, el cursor, mi reloj...' },
      { count: 4, label: 'Cosas que puedes tocar', icon: 'hand', color: 'text-emerald-500', bg: 'bg-emerald-50', placeholder: 'Ej: El escritorio, la tela de mi pantalón...' },
      { count: 3, label: 'Sonidos que escuchas', icon: 'ear', color: 'text-amber-500', bg: 'bg-amber-50', placeholder: 'Ej: Un automóvil fuera, el ventilador...' },
      { count: 2, label: 'Olores presentes', icon: 'wind', color: 'text-purple-500', bg: 'bg-purple-50', placeholder: 'Ej: Café recién hecho, aire fresco...' },
      { count: 1, label: 'Sabor o sensación en tu boca', icon: 'smile', color: 'text-rose-500', bg: 'bg-rose-50', placeholder: 'Ej: Sabor a menta, frescura del agua...' }
    ];

    function App() {
      const [mode, setMode] = useState('menu'); // 'menu', 'sos', 'grounding', 'muscle'
      const [history, setHistory] = useState([]);
      const [toast, setToast] = useState(null);
      const [showDeleteConfirm, setShowDeleteConfirm] = useState(false);

      // --- Mode 1: SOS 3-Min State ---
      const [sosStep, setSosStep] = useState(1); // 1: Respiración 4-7-8, 2: Escaneo Corporal, 3: Anclaje de Seguridad
      const [sosTimer, setSosTimer] = useState(19); // Breathe cycle duration
      const [breathPhase, setBreathPhase] = useState('Inhala (4s)'); // 'Inhala (4s)', 'Sostén (7s)', 'Exhala (8s)'

      // --- Mode 2: Grounding State ---
      const [groundingIndex, setGroundingIndex] = useState(0);
      const [groundingItems, setGroundingItems] = useState({ 5: [], 4: [], 3: [], 2: [], 1: [] });
      const [currentInput, setCurrentInput] = useState('');

      // --- Mode 3: Muscle Relaxation State ---
      const [selectedZone, setSelectedZone] = useState(MUSCLE_ZONES[0]);
      const [musclePhase, setMusclePhase] = useState('idle'); // 'idle', 'tense', 'release'
      const [muscleTimer, setMuscleTimer] = useState(0);

      // Load History on Mount
      useEffect(() => {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          if (saved) setHistory(JSON.parse(saved));
        } catch (e) { console.error(e); }
      }, []);

      const showToastMsg = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(null), 3000);
      };

      const saveCompletion = (techniqueName) => {
        const newEntry = {
          id: Date.now(),
          date: new Date().toLocaleDateString('es-ES', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }),
          technique: techniqueName
        };
        const updated = [newEntry, ...history].slice(0, 10);
        setHistory(updated);
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(updated));
          showToastMsg(`¡Sesión de ${techniqueName} completada con éxito!`);
        } catch (e) {}
      };

      const clearHistory = () => {
        setHistory([]);
        try {
          localStorage.removeItem(STORAGE_KEY);
          showToastMsg('Historial borrado correctamente.');
        } catch (e) {}
        setShowDeleteConfirm(false);
      };

      useEffect(() => {
        let interval = null;
        if (mode === 'sos' && sosStep === 1) {
          interval = setInterval(() => {
            setSosTimer(prev => {
              if (prev <= 1) {
                return 19; // Reset cycle
              }
              const currentSec = 19 - prev + 1;
              if (currentSec <= 4) setBreathPhase('Inhala despacio...');
              else if (currentSec <= 11) setBreathPhase('Sostén el aire...');
              else setBreathPhase('Exhala suavemente...');
              return prev - 1;
            });
          }, 1000);
        }
        return () => clearInterval(interval);
      }, [mode, sosStep]);

      useEffect(() => {
        let interval = null;
        if (mode === 'muscle' && musclePhase !== 'idle') {
          interval = setInterval(() => {
            setMuscleTimer(prev => {
              if (prev <= 1) {
                if (musclePhase === 'tense') {
                  setMusclePhase('release');
                  return 10; // 10s relax timer
                } else {
                  setMusclePhase('idle');
                  saveCompletion(`Relajación (${selectedZone.label})`);
                  return 0;
                }
              }
              return prev - 1;
            });
          }, 1000);
        }
        return () => clearInterval(interval);
      }, [mode, musclePhase, selectedZone]);

      // --- Grounding Handlers ---
      const handleAddGroundingItem = (e) => {
        e.preventDefault();
        if (!currentInput.trim()) return;

        const currentStepObj = GROUNDING_STEPS[groundingIndex];
        const stepKey = currentStepObj.count;
        const existing = groundingItems[stepKey] || [];

        if (existing.length < stepKey) {
          const updatedStepItems = [...existing, currentInput.trim()];
          setGroundingItems(prev => ({ ...prev, [stepKey]: updatedStepItems }));
          setCurrentInput('');

          // Auto-advance if reached step count
          if (updatedStepItems.length === stepKey) {
            if (groundingIndex < GROUNDING_STEPS.length - 1) {
              setGroundingIndex(prev => prev + 1);
            } else {
              saveCompletion('Grounding 5-4-3-2-1');
            }
          }
        }
      };

      const startMuscleTension = () => {
        setMusclePhase('tense');
        setMuscleTimer(5); // 5s tension
      };

      return (
        <div className="bg-white rounded-3xl shadow-sm border border-slate-200/80 p-5 sm:p-8 animate-fade-in relative min-h-[580px] flex flex-col justify-between">
          {toast && (
            <div className="fixed top-5 right-5 bg-emerald-600 text-white text-xs sm:text-sm font-semibold px-4 py-2.5 rounded-xl shadow-xl flex items-center gap-2 z-50 animate-fade-in">
              <Icon name="check" className="w-4 h-4" /> {toast}
            </div>
          )}

          {/* Header */}
          <header className="flex justify-between items-center border-b border-slate-100 pb-5 mb-6">
            <div className="flex items-center gap-3">
              <div className="w-10 h-10 rounded-2xl bg-rose-50 border border-rose-100 flex items-center justify-center text-rose-600 shadow-sm">
                <Icon name="shield" className="w-5 h-5" />
              </div>
              <div>
                <h1 className="text-xl sm:text-2xl font-bold text-slate-900 tracking-tight">Botiquín SOS</h1>
                <p className="text-xs text-slate-500 font-medium">Centro de Autorregulación de Emergencia</p>
              </div>
            </div>

            {mode !== 'menu' && (
              <button 
                onClick={() => setMode('menu')}
                className="px-3.5 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold rounded-xl text-xs transition-all flex items-center gap-1.5"
              >
                <Icon name="arrowRight" className="w-3.5 h-3.5 rotate-180" /> Salir
              </button>
            )}
          </header>

          {}
          {mode === 'menu' && (
            <div className="space-y-6 flex-1 flex flex-col justify-between">
              {/* Emergency Callout Banner */}
              <div className="bg-gradient-to-br from-rose-500 to-indigo-600 rounded-3xl p-6 text-white shadow-md relative overflow-hidden">
                <div className="absolute right-0 top-0 translate-x-4 -translate-y-4 opacity-10">
                  <Icon name="zap" size={160} />
                </div>
                <span className="inline-block px-3 py-1 bg-white/20 text-white text-[10px] font-bold uppercase tracking-wider rounded-full mb-3 backdrop-blur-sm">
                  Atención Inmediata
                </span>
                <h2 className="text-2xl font-extrabold mb-2">¿Sientes pánico o ansiedad alta?</h2>
                <p className="text-rose-100 text-xs sm:text-sm max-w-lg mb-5 leading-relaxed">
                  No necesitas sobrepensar. Elige cualquiera de las 3 herramientas somáticas para cortar la respuesta de alerta de tu cuerpo ahora mismo.
                </p>
              </div>

              {/* 3 Main Action Cards */}
              <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                {/* Mode 1: SOS 3 Min */}
                <button 
                  onClick={() => { setMode('sos'); setSosStep(1); setSosTimer(19); }}
                  className="group text-left p-5 rounded-2xl border-2 border-slate-100 bg-slate-50 hover:bg-white hover:border-rose-500 hover:shadow-md transition-all duration-300 flex flex-col justify-between"
                >
                  <div>
                    <div className="w-10 h-10 rounded-xl bg-rose-100 text-rose-600 flex items-center justify-center mb-3 group-hover:scale-110 transition-transform">
                      <Icon name="clock" className="w-5 h-5" />
                    </div>
                    <h3 className="font-bold text-slate-900 text-base mb-1">Pausa SOS (3 Min)</h3>
                    <p className="text-xs text-slate-500 leading-relaxed">
                      Respiración 4-7-8 guiada, escaneo corporal y anclaje de seguridad.
                    </p>
                  </div>
                  <div className="mt-4 flex items-center gap-1.5 text-rose-600 text-xs font-bold group-hover:gap-2 transition-all">
                    Iniciar Pausa <Icon name="arrowRight" className="w-3.5 h-3.5" />
                  </div>
                </button>

                {/* Mode 2: Grounding 5-4-3-2-1 */}
                <button 
                  onClick={() => { setMode('grounding'); setGroundingIndex(0); setGroundingItems({ 5: [], 4: [], 3: [], 2: [], 1: [] }); }}
                  className="group text-left p-5 rounded-2xl border-2 border-slate-100 bg-slate-50 hover:bg-white hover:border-indigo-600 hover:shadow-md transition-all duration-300 flex flex-col justify-between"
                >
                  <div>
                    <div className="w-10 h-10 rounded-xl bg-indigo-100 text-indigo-600 flex items-center justify-center mb-3 group-hover:scale-110 transition-transform">
                      <Icon name="anchor" className="w-5 h-5" />
                    </div>
                    <h3 className="font-bold text-slate-900 text-base mb-1">Ancla 5-4-3-2-1</h3>
                    <p className="text-xs text-slate-500 leading-relaxed">
                      Conecta tus 5 sentidos con el presente para cortar la rumiación.
                    </p>
                  </div>
                  <div className="mt-4 flex items-center gap-1.5 text-indigo-600 text-xs font-bold group-hover:gap-2 transition-all">
                    Iniciar Anclaje <Icon name="arrowRight" className="w-3.5 h-3.5" />
                  </div>
                </button>

                {/* Mode 3: Jacobsen Muscle Relaxation */}
                <button 
                  onClick={() => { setMode('muscle'); setMusclePhase('idle'); }}
                  className="group text-left p-5 rounded-2xl border-2 border-slate-100 bg-slate-50 hover:bg-white hover:border-emerald-600 hover:shadow-md transition-all duration-300 flex flex-col justify-between"
                >
                  <div>
                    <div className="w-10 h-10 rounded-xl bg-emerald-100 text-emerald-600 flex items-center justify-center mb-3 group-hover:scale-110 transition-transform">
                      <Icon name="activity" className="w-5 h-5" />
                    </div>
                    <h3 className="font-bold text-slate-900 text-base mb-1">Relajación Muscular</h3>
                    <p className="text-xs text-slate-500 leading-relaxed">
                      Técnica de Jacobsen para liberar tensión acumulada en el cuerpo.
                    </p>
                  </div>
                  <div className="mt-4 flex items-center gap-1.5 text-emerald-600 text-xs font-bold group-hover:gap-2 transition-all">
                    Liberar Tensión <Icon name="arrowRight" className="w-3.5 h-3.5" />
                  </div>
                </button>
              </div>

              {}
              <div className="border-t border-slate-100 pt-5 mt-4">
                <div className="flex justify-between items-center mb-3">
                  <h4 className="text-xs font-bold text-slate-400 uppercase tracking-wider flex items-center gap-2">
                    <Icon name="sparkles" className="w-3.5 h-3.5 text-amber-500" /> Registro de Calma Local
                  </h4>
                  {history.length > 0 && !showDeleteConfirm && (
                    <button 
                      onClick={() => setShowDeleteConfirm(true)}
                      className="text-xs text-rose-500 hover:text-rose-700 font-semibold flex items-center gap-1 transition-colors"
                    >
                      <Icon name="trash2" className="w-3.5 h-3.5" /> Borrar Historial
                    </button>
                  )}
                </div>

                {/* Custom Inline Confirmation for Deletion (No confirm() used) */}
                {showDeleteConfirm && (
                  <div className="bg-rose-50 border border-rose-200 rounded-xl p-3 mb-3 flex flex-col sm:flex-row items-center justify-between gap-2 animate-fade-in">
                    <span className="text-xs text-rose-800 font-medium">¿Seguro que deseas eliminar el historial de registros?</span>
                    <div className="flex items-center gap-2">
                      <button onClick={clearHistory} className="px-3 py-1 bg-rose-600 text-white rounded-lg text-xs font-bold hover:bg-rose-700">Sí, borrar</button>
                      <button onClick={() => setShowDeleteConfirm(false)} className="px-3 py-1 bg-slate-200 text-slate-700 rounded-lg text-xs font-semibold hover:bg-slate-300">Cancelar</button>
                    </div>
                  </div>
                )}

                {history.length === 0 ? (
                  <p className="text-xs text-slate-400 italic">No hay sesiones registradas hoy. Realiza tu primera práctica.</p>
                ) : (
                  <div className="flex gap-2 overflow-x-auto pb-2">
                    {history.map(item => (
                      <div key={item.id} className="flex-shrink-0 bg-slate-50 border border-slate-200/60 rounded-xl px-3.5 py-2 text-xs">
                        <div className="font-bold text-slate-700">{item.technique}</div>
                        <div className="text-[10px] text-slate-400">{item.date}</div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            </div>
          )}

          {}
          {mode === 'sos' && (
            <div className="flex-1 flex flex-col justify-between space-y-6 animate-fade-in">
              {/* Stepper Header */}
              <div className="flex items-center justify-between bg-slate-50 p-3 rounded-2xl border border-slate-100">
                {[1, 2, 3].map(stepNum => (
                  <div key={stepNum} className="flex items-center gap-2">
                    <div className={`w-7 h-7 rounded-xl flex items-center justify-center font-bold text-xs ${
                      sosStep === stepNum ? 'bg-rose-600 text-white shadow-sm' : sosStep > stepNum ? 'bg-emerald-500 text-white' : 'bg-slate-200 text-slate-500'
                    }`}>
                      {sosStep > stepNum ? <Icon name="check" className="w-4 h-4" /> : stepNum}
                    </div>
                    <span className={`text-xs font-semibold hidden sm:inline ${sosStep === stepNum ? 'text-slate-800' : 'text-slate-400'}`}>
                      {stepNum === 1 ? 'Respiración 4-7-8' : stepNum === 2 ? 'Escaneo Corporal' : 'Anclaje de Paz'}
                    </span>
                  </div>
                ))}
              </div>

              {/* Step 1: Respiración 4-7-8 */}
              {sosStep === 1 && (
                <div className="flex-1 flex flex-col items-center justify-center text-center py-6">
                  <div className="relative flex items-center justify-center mb-6">
                    <div className="w-44 h-44 rounded-full bg-rose-100 border-4 border-rose-400 flex items-center justify-center animate-breathe">
                      <div className="w-28 h-28 rounded-full bg-rose-500 text-white flex items-center justify-center shadow-lg font-bold text-lg">
                        {breathPhase.split(' ')[0]}
                      </div>
                    </div>
                  </div>
                  <h3 className="text-xl font-bold text-slate-900 mb-1">{breathPhase}</h3>
                  <p className="text-xs text-slate-500 max-w-sm mb-6">
                    Ritmo calmará tu nervio vago: Inhala en 4s, sostén en 7s, exhala despacio en 8s.
                  </p>
                  <button 
                    onClick={() => setSosStep(2)}
                    className="px-6 py-3 bg-rose-600 hover:bg-rose-700 text-white font-bold rounded-xl shadow-md text-sm transition-all flex items-center gap-2"
                  >
                    Siguiente: Escaneo Corporal <Icon name="arrowRight" className="w-4 h-4" />
                  </button>
                </div>
              )}

              {/* Step 2: Escaneo Corporal */}
              {sosStep === 2 && (
                <div className="flex-1 flex flex-col items-center justify-center text-center py-4 space-y-4">
                  <div className="w-14 h-14 rounded-2xl bg-indigo-100 text-indigo-600 flex items-center justify-center">
                    <Icon name="activity" className="w-7 h-7" />
                  </div>
                  <h3 className="text-xl font-bold text-slate-900">Ubicando la Tensión</h3>
                  <p className="text-xs text-slate-500 max-w-md leading-relaxed">
                    Coloca tu mano en tu pecho o abdomen. Nota dónde sientes la activación física (mandíbula, pecho, cuello) y exhala soltando esa zona.
                  </p>
                  <div className="bg-indigo-50 border border-indigo-100 rounded-2xl p-4 max-w-sm text-left text-xs text-indigo-900 space-y-2">
                    <div className="flex items-center gap-2 font-bold text-indigo-700">
                      <Icon name="sparkles" className="w-4 h-4" /> Recordatorio Somático:
                    </div>
                    <p>La tensión es simplemente energía buscando salida. No es peligrosa, déjala fluir mientras exhalas.</p>
                  </div>
                  <button 
                    onClick={() => setSosStep(3)}
                    className="px-6 py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shadow-md text-sm transition-all flex items-center gap-2 mt-4"
                  >
                    Siguiente: Frase de Anclaje <Icon name="arrowRight" className="w-4 h-4" />
                  </button>
                </div>
              )}

              {/* Step 3: Anclaje de Seguridad */}
              {sosStep === 3 && (
                <div className="flex-1 flex flex-col items-center justify-center text-center py-6 space-y-4">
                  <div className="w-14 h-14 rounded-2xl bg-emerald-100 text-emerald-600 flex items-center justify-center">
                    <Icon name="heart" className="w-7 h-7" />
                  </div>
                  <h3 className="text-2xl font-bold text-slate-900">Anclaje de Seguridad</h3>
                  <div className="bg-slate-900 text-white rounded-2xl p-6 max-w-md shadow-lg border border-slate-800">
                    <p className="text-base font-semibold leading-relaxed italic">
                      "Esta sensación es incómoda, pero es totalmente segura. Mi cuerpo ya está volviendo al equilibrio."
                    </p>
                  </div>
                  <button 
                    onClick={() => { saveCompletion('Pausa SOS (3 Min)'); setMode('menu'); }}
                    className="px-8 py-3.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl shadow-md text-sm transition-all flex items-center gap-2 mt-2"
                  >
                    <Icon name="check" className="w-4 h-4" /> Finalizar y Guardar Práctica
                  </button>
                </div>
              )}
            </div>
          )}

          {}
          {mode === 'grounding' && (
            <div className="flex-1 flex flex-col justify-between space-y-5 animate-fade-in">
              {/* Progress Header */}
              <div>
                <div className="flex justify-between items-center mb-2">
                  <span className="text-xs font-bold text-slate-500 uppercase tracking-wider">
                    Paso {groundingIndex + 1} de 5: {GROUNDING_STEPS[groundingIndex].label}
                  </span>
                  <span className="text-xs font-bold text-indigo-600">
                    {GROUNDING_STEPS[groundingIndex].count} elementos requeridos
                  </span>
                </div>
                <div className="w-full h-2 bg-slate-100 rounded-full overflow-hidden">
                  <div 
                    className="h-full bg-indigo-600 transition-all duration-300 rounded-full"
                    style={{ width: `${((groundingIndex + 1) / 5) * 100}%` }}
                  ></div>
                </div>
              </div>

              {/* Current Step Interactive Card */}
              {(() => {
                const currentStep = GROUNDING_STEPS[groundingIndex];
                const registered = groundingItems[currentStep.count] || [];
                const remaining = currentStep.count - registered.length;

                return (
                  <div className="bg-slate-50 rounded-2xl border border-slate-200/80 p-5 sm:p-6 flex-1 flex flex-col justify-between">
                    <div>
                      <div className="flex items-center gap-3 mb-4">
                        <div className={`p-3 rounded-xl ${currentStep.bg} ${currentStep.color}`}>
                          <Icon name={currentStep.icon} className="w-6 h-6" />
                        </div>
                        <div>
                          <h3 className="font-bold text-slate-900 text-lg">Nombra {currentStep.count} {currentStep.label}</h3>
                          <p className="text-xs text-slate-500">Observa tu entorno físico con curiosidad.</p>
                        </div>
                      </div>

                      {/* Items List */}
                      <div className="space-y-2 mb-4">
                        {registered.map((item, idx) => (
                          <div key={idx} className="bg-white border border-slate-200 rounded-xl p-3 text-xs font-medium text-slate-700 flex items-center gap-2 shadow-sm animate-fade-in">
                            <Icon name="check" className="w-4 h-4 text-emerald-500" />
                            <span>{item}</span>
                          </div>
                        ))}
                      </div>
                    </div>

                    {remaining > 0 ? (
                      <form onSubmit={handleAddGroundingItem} className="flex gap-2 mt-4">
                        <input 
                          type="text" 
                          value={currentInput}
                          onChange={(e) => setCurrentInput(e.target.value)}
                          placeholder={currentStep.placeholder}
                          className="flex-1 px-4 py-3 bg-white border border-slate-200 rounded-xl text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
                        />
                        <button 
                          type="submit"
                          className="px-5 py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl text-xs transition-all flex items-center gap-1"
                        >
                          Añadir
                        </button>
                      </form>
                    ) : (
                      <div className="text-center py-3">
                        <span className="text-xs font-bold text-emerald-600 flex items-center justify-center gap-1">
                          <Icon name="check" className="w-4 h-4" /> ¡Paso completado! Avanzando...
                        </span>
                      </div>
                    )}
                  </div>
                );
              })()}
            </div>
          )}

          {}
          {mode === 'muscle' && (
            <div className="flex-1 flex flex-col justify-between space-y-6 animate-fade-in">
              {/* Zone Selector Pills */}
              <div className="flex gap-2 overflow-x-auto pb-1">
                {MUSCLE_ZONES.map(zone => (
                  <button
                    key={zone.id}
                    onClick={() => { setSelectedZone(zone); setMusclePhase('idle'); }}
                    className={`px-4 py-2.5 rounded-xl text-xs font-bold whitespace-nowrap transition-all border ${
                      selectedZone.id === zone.id 
                        ? 'bg-emerald-600 text-white border-emerald-600 shadow-sm' 
                        : 'bg-slate-50 text-slate-600 border-slate-200 hover:bg-slate-100'
                    }`}
                  >
                    {zone.label}
                  </button>
                ))}
              </div>

              {/* Main Interactive Muscle Box */}
              <div className="bg-slate-50 border border-slate-200 rounded-3xl p-6 text-center flex-1 flex flex-col items-center justify-center relative overflow-hidden">
                <div className="w-16 h-16 rounded-2xl bg-emerald-100 text-emerald-600 flex items-center justify-center mb-4">
                  <Icon name={selectedZone.icon} className="w-8 h-8" />
                </div>

                <h3 className="text-xl font-bold text-slate-900 mb-2">{selectedZone.label}</h3>
                <p className="text-xs text-slate-600 max-w-sm mb-6 leading-relaxed">
                  {selectedZone.instructions}
                </p>

                {musclePhase === 'idle' && (
                  <button 
                    onClick={startMuscleTension}
                    className="px-8 py-3.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl shadow-md text-sm transition-all flex items-center gap-2"
                  >
                    <Icon name="zap" className="w-4 h-4" /> Iniciar Tensión (5s)
                  </button>
                )}

                {musclePhase === 'tense' && (
                  <div className="space-y-3 animate-fade-in">
                    <div className="w-24 h-24 rounded-full bg-amber-500 text-white flex items-center justify-center text-3xl font-extrabold mx-auto shadow-lg animate-pulse">
                      {muscleTimer}s
                    </div>
                    <p className="text-sm font-bold text-amber-700 uppercase tracking-wider">
                      ¡APRIETA Y CONTRAE AHORA!
                    </p>
                  </div>
                )}

                {musclePhase === 'release' && (
                  <div className="space-y-3 animate-fade-in">
                    <div className="w-24 h-24 rounded-full bg-emerald-500 text-white flex items-center justify-center text-3xl font-extrabold mx-auto shadow-lg">
                      {muscleTimer}s
                    </div>
                    <p className="text-sm font-bold text-emerald-700 uppercase tracking-wider">
                      ¡SOLTANDO DE GOLPE! Siente la liberación.
                    </p>
                  </div>
                )}
              </div>
            </div>
          )}
        </div>
      );
    }

    const rootElement = document.getElementById('root');
    ReactDOM.createRoot(rootElement).render(<App />);
  </script>
</body>
</html>
